# netlify.toml
# File cấu hình để deploy ứng dụng Python FastAPI lên Netlify.

[build]
  # Lệnh để cài đặt các thư viện Python cần thiết từ file requirements.txt.
  command = "pip install -r requirements.txt"
  
  # Thư mục chứa các file frontend tĩnh (HTML, CSS, JS) để publish.
  # Dựa trên file main.py, thư mục này có tên là "static".
  publish = "static"

[functions]
  # Thư mục chứa file serverless function.
  # Vì server.py nằm ở thư mục gốc, chúng ta chỉ định là ".".
  directory = "."

# Cấu hình chuyển hướng (redirects) rất quan trọng.
[[redirects]]
  # Chuyển hướng tất cả các request API (bắt đầu bằng /api/)
  # đến serverless function 'server' (được tạo từ file server.py).
  from = "/api/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[[redirects]]
  # Dành cho ứng dụng trang đơn (Single Page Application).
  # Đảm bảo mọi đường dẫn không phải API đều trỏ về index.html để client-side routing hoạt động.
  from = "/*"
  to = "/index.html"
  status = 200