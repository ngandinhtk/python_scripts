# netlify.toml
# File cấu hình để deploy ứng dụng Python FastAPI lên Netlify.

[build]
  # Lệnh để cài đặt các thư viện Python cần thiết từ file requirements.txt.
  command = "pip install -r requirements.txt"
  
  # Thư mục chứa các file frontend tĩnh (HTML, CSS, JS) để publish.
  # Dựa trên file main.py, thư mục này có tên là "static".
  publish = "static"

[functions]
  # Thư mục chứa file serverless function.
  # Vì server.py nằm ở thư mục gốc, chúng ta chỉ định là ".".
  directory = "."

# Cấu hình chuyển hướng (redirects) rất quan trọng.
[[redirects]]
  # Chuyển hướng tất cả các request API (bắt đầu bằng /api/) đến serverless function.
  # QUAN TRỌNG: Phần path gốc (/api/) được giữ lại trong URL đích
  # để FastAPI có thể định tuyến chính xác.
  from = "/api/*"
  to = "/.netlify/functions/server/api/:splat"
  status = 200

[[redirects]]
  # Chuyển hướng request kiểm tra "sức khỏe" đến serverless function.
  from = "/health"
  to = "/.netlify/functions/server/health"
  status = 200

[[redirects]]
  # SPA Fallback: Mọi request không khớp với các quy tắc trên sẽ trả về trang chủ.
  # Quy tắc này phải nằm ở cuối cùng.
  from = "/*"
  to = "/index.html"
  status = 200