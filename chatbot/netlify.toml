[build]
  # This is the directory where Netlify will look for your serverless functions.
  functions = "netlify/functions"

[functions]
  # This ensures that your main application code in the 'app' directory
  # is included in the deployment package for the function.
  included_files = ["app/**"]

[[redirects]]
  # This rule rewrites all incoming requests to your serverless function.
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200