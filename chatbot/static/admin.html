<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Xem Lịch Sử Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Basic styles from index.html for consistency */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #4f46e5; --bg: #f9fafb; --surface: #ffffff; --border: #e5e7eb;
    --text: #1f2937; --muted: #6b7280; --user-bubble: #dbeafe; --bot-bubble: #f3f4f6;
  }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

  /* Layout */
  .admin-layout { display: flex; height: 100vh; }
  .sidebar { width: 320px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .main-content { flex: 1; display: flex; flex-direction: column; height: 100vh; }

  /* Sidebar */
  .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
  .sidebar-header h1 { font-size: 18px; }
  .sidebar-header p { font-size: 12px; color: var(--muted); }
  .session-list { flex: 1; overflow-y: auto; }
  .session-item {
    padding: 12px 16px; font-size: 14px; cursor: pointer;
    border-bottom: 1px solid var(--border);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .session-item:hover { background: #f3f4f6; }
  .session-item.active { background: var(--primary); color: white; font-weight: 600; }

  /* Main Content */
  .chat-header { padding: 16px; background: var(--surface); border-bottom: 1px solid var(--border); font-weight: 600; }
  .messages { flex: 1; overflow-y: auto; padding: 20px; }
  
  /* Message styles from index.html */
  .msg-row { display: flex; gap: 8px; align-items: flex-end; margin-bottom: 12px; }
  .msg-row.user { flex-direction: row-reverse; }
  .msg-avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; background: var(--bot-bubble); }
  .bubble { max-width: 75%; padding: 10px 14px; border-radius: 16px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg-row.bot .bubble { background: var(--bot-bubble); color: var(--text); border-bottom-left-radius: 4px; }
  .msg-row.user .bubble { background: var(--user-bubble); color: #1e40af; border-bottom-right-radius: 4px; }
  .placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--muted); }
</style>
</head>
<body>

<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>Lịch Sử Hội Thoại</h1>
      <p id="sessionCount">Đang tải...</p>
    </div>
    <div class="session-list" id="sessionList">
      <!-- Session items will be injected here by JS -->
    </div>
  </aside>

  <main class="main-content">
    <div class="chat-header" id="chatHeader">
      Chọn một phiên để xem
    </div>
    <div class="messages" id="messages">
      <div class="placeholder">
        <p>← Vui lòng chọn một phiên hội thoại từ danh sách bên trái.</p>
      </div>
    </div>
  </main>
</div>

<script>
  const sessionListEl = document.getElementById('sessionList');
  const messagesEl = document.getElementById('messages');
  const chatHeaderEl = document.getElementById('chatHeader');
  const sessionCountEl = document.getElementById('sessionCount');

  async function loadSessions() {
    try {
      const response = await fetch('/api/v1/history');
      if (!response.ok) throw new Error('Failed to fetch sessions');
      const data = await response.json();
      
      sessionListEl.innerHTML = ''; // Clear list
      sessionCountEl.textContent = `${data.sessions.length} phiên hội thoại`;

      data.sessions.forEach(sessionId => {
        const item = document.createElement('div');
        item.className = 'session-item';
        item.textContent = sessionId;
        item.dataset.sessionId = sessionId;
        item.onclick = () => loadConversation(sessionId);
        sessionListEl.appendChild(item);
      });

    } catch (error) {
      sessionCountEl.textContent = 'Lỗi khi tải';
      console.error('Error loading sessions:', error);
    }
  }

  async function loadConversation(sessionId) {
    // Highlight active session
    document.querySelectorAll('.session-item').forEach(el => {
      el.classList.toggle('active', el.dataset.sessionId === sessionId);
    });

    chatHeaderEl.textContent = `Hội thoại: ${sessionId}`;
    messagesEl.innerHTML = '<p>Đang tải tin nhắn...</p>';

    try {
      const response = await fetch(`/api/v1/history/${sessionId}`);
      if (!response.ok) throw new Error('Failed to fetch conversation');
      const data = await response.json();

      messagesEl.innerHTML = ''; // Clear messages
      if (!data.history || data.history.length === 0) {
        messagesEl.innerHTML = '<p>Không có tin nhắn nào trong phiên này.</p>';
        return;
      }

      data.history.forEach(msg => {
        addMessage(msg.role, msg.content);
      });

    } catch (error) {
      messagesEl.innerHTML = '<p>Lỗi khi tải hội thoại.</p>';
      console.error(`Error loading conversation ${sessionId}:`, error);
    }
  }

  function addMessage(role, content) {
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;

    const avatarEl = document.createElement('div');
    avatarEl.className = 'msg-avatar';
    avatarEl.textContent = role === 'bot' ? '🤖' : '👤';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = content;

    if (role === 'bot') {
      row.appendChild(avatarEl);
      row.appendChild(bubble);
    } else {
      row.appendChild(bubble);
      row.appendChild(avatarEl);
    }
    messagesEl.appendChild(row);
  }

  // Initial load
  window.onload = loadSessions;
</script>

</body>
</html>
